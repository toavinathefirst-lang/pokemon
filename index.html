<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon-like</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet" />

  </head>
  <body>
    <div class="game">
      <div id="overlappingDiv"></div>

      <canvas></canvas>
      <div id="characterDialogueBox"></div>

      <div id="userInterface">
        <!-- Barre de vie de Draggle (ennemi) -->
        <div class="health-box health-box--enemy">
          <h1>Draggle</h1>
          <div class="health-bar">
            <div class="health-bar__track"></div>
            <div id="enemyHealthBar"></div>
          </div>
        </div>

        <!-- Barre de vie d'Emby (nous) -->
        <div class="health-box health-box--player">
          <h1>Emby</h1>
          <div class="health-bar">
            <div class="health-bar__track"></div>
            <div id="playerHealthBar"></div>
          </div>
        </div>

        <div class="battle-menu">
          <div id="dialogueBox">sdkfjlsdajl</div>
          <div id="attacksBox"></div>
          <div class="attack-type-box">
            <h1 id="attackType">Attack Type</h1>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"
      integrity="sha512-6+YN/9o9BWrk6wSfGxQGpt3EUK6XeHi6yeHV+TYD2GR0Sj/cggRpXr1BrAQf0as6XslxomMUxXp2vIl+fv0QRA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"
      integrity="sha512-H6cPm97FAsgIKmlBA4s774vqoN24V5gSQL4yBTDOY2su2DeXZVhQPxFK4P6GPdnZqM9fg1G3cMv5wD7e6cFLZQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
